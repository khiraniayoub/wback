services:

  wback:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./wback:/home/wback
      - ./mediafiles:/home/wback/mediafiles
    env_file:
      - .env
    networks:
      - wback-network
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15.0-alpine
    volumes:
      - postgres_data_0:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=userwback
      - POSTGRES_PASSWORD=wbackpassword
      - POSTGRES_DB=wbackdb
    networks:
      - wback-network
  redis:
    image: redis
    restart: always
    environment:
      - REDIS_PASSWORD=redispassword
    ports:
      - '6379:6379'
    command: redis-server --requirepass $REDIS_PASSWORD
    networks:
      - wback-network

volumes:
  postgres_data_0:

networks:
  wback-network:
    driver: bridge
